name: 🎯 Recognition or cleanup error
description: Words were misheard, or the cleanup changed your meaning
title: "[Recognition] "
labels: ["recognition", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ Please do **not** upload recordings. Type out what you said instead, and mask anything private.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported
          required: true
        - label: One issue per report
          required: true
        - label: No recordings, passwords or private text included
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - iPhone
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TalkDone version
      description: Settings → About
      placeholder: "1.7"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Chinese
        - English
        - Mixed
        - Other
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What you said
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What TalkDone typed
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context (optional)
      placeholder: "e.g. names, product terms, code"
