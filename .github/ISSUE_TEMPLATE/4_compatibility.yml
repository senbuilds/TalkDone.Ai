name: ⌨️ App compatibility
description: TalkDone doesn't work in a specific app
title: "[Compatibility] "
labels: ["compatibility", "needs-triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported
          required: true
        - label: One issue per report
          required: true
        - label: No recordings, passwords or private text included
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - iPhone
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TalkDone version
      description: Settings → About
      placeholder: "1.7"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App name and version
      placeholder: "e.g. WeChat 4.0, Slack, VS Code"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
      placeholder: "Nothing appears, text appears twice, wrong position ..."
    validations:
      required: true
  - type: dropdown
    id: other_apps
    attributes:
      label: Does it work in other apps?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
